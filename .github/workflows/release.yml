name: Validate release

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v6
      - run: bun test
      - run: uvx --from check-jsonschema check-jsonschema --schemafile https://zed.dev/schema/themes/v0.2.0.json themes/*.json
